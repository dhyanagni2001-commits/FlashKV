name: Demo

# Builds the WebAssembly playground and publishes it to the gh-pages
# branch, which GitHub Pages serves at
# https://dhyanagni2001-commits.github.io/FlashKV/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build playground
        run: |
          ./web/build.sh
          mkdir site
          cp web/dist/index.html site/
          touch site/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: site
          commit_message: Deploy FlashKV playground
